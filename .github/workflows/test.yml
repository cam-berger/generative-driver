name: Installed package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dashboard browser behavior
        run: node tests/dashboard-client.test.js
      - name: Build the distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel
        shell: python
        run: |
          import glob, subprocess, sys
          wheel, = glob.glob('dist/*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', wheel], check=True)
      - name: Test outside the checkout
        shell: python
        run: |
          from pathlib import Path
          import glob, os, subprocess, sys, tempfile
          repo = Path.cwd()
          with tempfile.TemporaryDirectory(prefix='installed package ') as work:
              env = dict(os.environ)
              env.pop('PYTHONPATH', None)
              env['GD_TEST_WHEEL'] = str(Path(glob.glob('dist/*.whl')[0]).resolve())
              subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', str(repo / 'tests'), '-v'], cwd=work, env=env, check=True)
              subprocess.run([sys.executable, '-m', 'generative_driver', 'benchmark', 'run', '--case', 'setup-smoke', '--output', str(Path(work) / 'smoke')], cwd=work, env=env, check=True)
