[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-driver"
version = "0.1.0"
description = "Generate device interfaces through firmware evidence and checked experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["mcp>=2.2,<3", "cryptography>=43"]

[project.optional-dependencies]
hardware = ["pyserial>=3.5", "pyusb>=1.3", "pyftdi>=0.57", "esptool>=4.8"]
docs = ["pypdf>=5"]
dev = ["build>=1.2"]

[project.scripts]
generative-driver = "generative_driver.cli:main"
generative-driver-mcp = "generative_driver.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
generative_driver = ["resources/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
